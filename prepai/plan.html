<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Improvement Plan – PrepAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="plan" data-nav="plan.html">
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" data-icon="menu"></button>
      <h1 class="topbar-title">Improvement Plan</h1>
      <div class="topbar-tools"></div>
      <a class="icon-btn account-btn" href="settings.html" aria-label="Account and settings" title="Account and settings" data-icon="settings"></a>
    </header>
    <main class="content">

      <section>
        <h2 class="page-heading">Your Improvement Plan</h2>
        <p class="subtle">Focus on the skills that will make the biggest difference.</p>
      </section>
      <section>
        <h3 class="section-title">Skill assessment</h3>
        <div class="skills" id="skills"></div>
      </section>
      <section>
        <h3 class="section-title">Your Next Three Actions</h3>
        <div class="skills" id="actions"></div>
      </section>
      <details class="disclosure">
        <summary>View Detailed Feedback<span class="chev" data-icon="chevron" data-size="18"></span></summary>
        <div class="disclosure-body">
          <div><h4 class="row-title">Recurring mistakes</h4><ul class="bullets" id="mistakes"></ul></div>
          <div id="notes" style="display:flex;flex-direction:column;gap:16px"></div>
        </div>
      </details>
    </main>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
