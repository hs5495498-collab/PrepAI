<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achievements – PrepAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="achievements" data-nav="achievements.html">
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" data-icon="menu"></button>
      <h1 class="topbar-title">Achievements</h1>
      <div class="topbar-tools"></div>
      <a class="icon-btn account-btn" href="settings.html" aria-label="Account and settings" title="Account and settings" data-icon="settings"></a>
    </header>
    <main class="content">

      <section>
        <h3 class="section-title" style="margin-bottom:12px">Recent milestones</h3>
        <div class="featured" id="featured"></div>
      </section>
      <section>
        <h3 class="section-title">Earlier milestones</h3>
        <div id="unlocked" style="border-top:1px solid var(--border);margin-top:12px"></div>
      </section>
      <section>
        <h3 class="section-title">Not yet unlocked</h3>
        <div id="locked" style="border-top:1px solid var(--border);margin-top:12px"></div>
      </section>
    </main>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
